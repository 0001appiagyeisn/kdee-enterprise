<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KD Enterprise — Admin Stock Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --admin-bg: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #121212;
      --accent: #d4af37;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --border: #e2e8f0;
      --danger: #e74c3c;
      --success: #2ecc71;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--admin-bg); color: var(--text-main); }

    .admin-navbar {
      background: var(--primary);
      color: #ffffff;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .admin-navbar .logo { font-size: 1.4rem; font-weight: 700; }
    .admin-navbar .logo span { color: var(--accent); }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .view-shop-link, .btn-logout {
      color: #fff; text-decoration: none; font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 4px;
      background: transparent; cursor: pointer;
    }

    /* Auth Gate Overlay */
    .auth-overlay {
      position: fixed; inset: 0; background: rgba(18, 18, 18, 0.95);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: #fff; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center;
    }
    .auth-card h2 { margin-bottom: 20px; font-size: 1.5rem; }
    .auth-card input {
      width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px;
    }

    /* ===== Inventory Dashboard (Phase 2) ===== */
    .dashboard-section { max-width: 1200px; margin: 40px auto 0; padding: 0 20px; }
    .dashboard-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    @media(max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media(max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } }
    .stat-card {
      background: var(--card-bg); border-radius: 8px; padding: 22px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; border-left: 4px solid var(--accent);
    }
    .stat-icon {
      width: 48px; height: 48px; border-radius: 50%; background: #faf6e6; color: var(--accent);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
    }
    .stat-card.danger { border-left-color: var(--danger); }
    .stat-card.danger .stat-icon { background: #fdeceb; color: var(--danger); }
    .stat-card.success { border-left-color: var(--success); }
    .stat-card.success .stat-icon { background: #e9f9f0; color: var(--success); }
    .stat-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.5px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); word-break: break-word; }

    .admin-wrapper {
      max-width: 1200px; margin: 30px auto 40px; padding: 0 20px;
      display: grid; grid-template-columns: 1fr 1.4fr; gap: 30px;
    }
    @media(max-width: 900px) { .admin-wrapper { grid-template-columns: 1fr; } }

    .admin-card {
      background: var(--card-bg); border-radius: 8px; padding: 30px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .admin-card h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .btn-submit {
      width: 100%; background: var(--primary); color: #ffffff; padding: 14px;
      border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s;
    }
    .btn-submit:hover { background: var(--accent); }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

    /* ===== Bulk select bar (Phase 1) ===== */
    .bulk-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 10px 12px; margin-bottom: 15px; background: #fafafa;
      border: 1px solid var(--border); border-radius: 6px;
    }
    .select-all-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .bulk-bar input[type="checkbox"], .row-check { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
    .bulk-right { display: flex; align-items: center; gap: 12px; }
    .selected-count { font-size: 0.8rem; color: var(--text-muted); }
    .btn-bulk-delete {
      background: var(--danger); color: #fff; border: none; padding: 8px 14px; border-radius: 4px;
      cursor: pointer; font-size: 0.85rem; font-weight: 600; font-family: inherit;
    }
    .btn-bulk-delete:disabled { background: #ccc; cursor: not-allowed; }

    .inventory-list { display: flex; flex-direction: column; gap: 15px; max-height: 550px; overflow-y: auto; }
    .stock-row {
      display: flex; align-items: center; gap: 15px; padding: 12px;
      background: #fafafa; border-radius: 6px; border: 1px solid var(--border);
    }
    .stock-row.selected { border-color: var(--accent); background: #fffdf3; }
    .stock-row img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .stock-info { flex-grow: 1; min-width: 0; }
    .stock-info h4 { font-size: 0.95rem; margin-bottom: 4px; }
    .stock-info p { font-size: 0.85rem; color: var(--text-muted); }

    .stock-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .stock-controls input { width: 60px; padding: 6px; text-align: center; border: 1px solid var(--border); border-radius: 4px; }
    .btn-action { padding: 8px 12px; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
    .btn-save { background: var(--success); }
    .btn-edit { background: #3498db; }
    .btn-delete { background: var(--danger); }

    @media(max-width: 600px) {
      .stock-row { flex-wrap: wrap; }
      .stock-controls { width: 100%; justify-content: flex-start; }
    }

    /* ===== Edit Modal (Phase 1) ===== */
    .edit-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 5000;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .edit-overlay.active { display: flex; }
    .edit-modal {
      background: #fff; width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto;
      border-radius: 8px; padding: 30px; position: relative;
    }
    .edit-modal h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .edit-close {
      position: absolute; top: 14px; right: 18px; background: none; border: none;
      font-size: 1.8rem; cursor: pointer; color: var(--primary);
    }
    .img-manager { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .img-thumb { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); background: #f0f0f0; }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .img-thumb .remove-img {
      position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
      background: var(--danger); color: #fff; border: none; cursor: pointer; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
    }
    .img-thumb .new-tag {
      position: absolute; bottom: 0; left: 0; right: 0; background: var(--accent); color: #fff;
      font-size: 0.65rem; text-align: center; font-weight: 700; padding: 2px 0; text-transform: uppercase;
    }
    .img-hint { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
    .edit-actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-cancel {
      width: 100%; background: #eee; color: var(--primary); padding: 14px; border: none;
      border-radius: 6px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- Admin Login Modal -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
      <h2>Admin Login</h2>
      <form id="login-form">
        <input type="email" id="admin-email" placeholder="Admin Email" required>
        <input type="password" id="admin-password" placeholder="Password" required>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <header class="admin-navbar">
    <div class="logo">KD <span>Admin Dashboard</span></div>
    <div class="nav-actions">
      <a href="index.html" class="view-shop-link"><i class="fa-solid fa-store"></i> View Storefront</a>
      <button id="logout-btn" class="btn-logout" style="display:none;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <!-- Inventory Dashboard -->
  <section class="dashboard-section">
    <div class="dashboard-title"><i class="fa-solid fa-chart-line"></i> Inventory Overview</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-shirt"></i></div>
        <div>
          <div class="stat-label">Total Products</div>
          <div class="stat-value" id="stat-total-products">0</div>
        </div>
      </div>
      <div class="stat-card success">
        <div class="stat-icon"><i class="fa-solid fa-cubes"></i></div>
        <div>
          <div class="stat-label">Units In Stock</div>
          <div class="stat-value" id="stat-total-units">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-coins"></i></div>
        <div>
          <div class="stat-label">Inventory Value</div>
          <div class="stat-value" id="stat-inventory-value">GHS 0.00</div>
        </div>
      </div>
      <div class="stat-card danger">
        <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div>
          <div class="stat-label">Out Of Stock</div>
          <div class="stat-value" id="stat-out-of-stock">0</div>
        </div>
      </div>
    </div>
  </section>

  <main class="admin-wrapper">
    <!-- Product Upload Section -->
    <section class="admin-card">
      <h2><i class="fa-solid fa-plus-circle"></i> Add New Product</h2>
      <form id="add-product-form">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="p-name" placeholder="e.g. Designer Linen Shirt" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Price (GHS)</label>
            <input type="number" step="0.01" id="p-price" placeholder="150.00" required>
          </div>
          <div class="form-group">
            <label>Initial Stock</label>
            <input type="number" id="p-stock" placeholder="10" required>
          </div>
        </div>
        <div class="form-group">
          <label>Product Description</label>
          <textarea id="p-desc" rows="3" placeholder="Fabric, fit details, sizing..."></textarea>
        </div>
        <div class="form-group">
          <label>Select Multiple Images</label>
          <input type="file" id="p-image-file" accept="image/*" multiple required>
        </div>
        <button type="submit" id="upload-btn" class="btn-submit">Upload To Store</button>
      </form>
    </section>

    <!-- Stock Management Section -->
    <section class="admin-card">
      <h2><i class="fa-solid fa-boxes-stacked"></i> Current Inventory</h2>

      <div class="bulk-bar">
        <label class="select-all-label">
          <input type="checkbox" id="select-all"> Select All
        </label>
        <div class="bulk-right">
          <span class="selected-count" id="selected-count">0 selected</span>
          <button id="bulk-delete-btn" class="btn-bulk-delete" disabled>
            <i class="fa-solid fa-trash"></i> Delete Selected
          </button>
        </div>
      </div>

      <div id="admin-inventory-list" class="inventory-list"></div>
    </section>
  </main>

  <!-- Edit Product Modal -->
  <div class="edit-overlay" id="edit-overlay">
    <div class="edit-modal">
      <button class="edit-close" id="edit-close" type="button">&times;</button>
      <h2><i class="fa-solid fa-pen-to-square"></i> Edit Product</h2>
      <form id="edit-product-form">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="e-name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Price (GHS)</label>
            <input type="number" step="0.01" id="e-price" required>
          </div>
          <div class="form-group">
            <label>Stock</label>
            <input type="number" id="e-stock" required>
          </div>
        </div>
        <div class="form-group">
          <label>Product Description</label>
          <textarea id="e-desc" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Images</label>
          <div class="img-hint">Click the red × to remove an image. Newly added images are tagged "New".</div>
          <div class="img-manager" id="e-image-manager"></div>
          <input type="file" id="e-image-file" accept="image/*" multiple>
        </div>
        <div class="edit-actions">
          <button type="button" class="btn-cancel" id="edit-cancel">Cancel</button>
          <button type="submit" class="btn-submit" id="edit-save-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
